<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="inventory.title">Inventory - Mini Supermarket</title>
    <link rel="stylesheet" href="negozio-app.css">
</head>
<body>
    <header class="top-bar">
        <h1 class="page-title"><img class="emoji-img" src="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/1F6CD.svg" alt="shopping bags" width="24" height="24"> <span data-i18n="app.title">Mini Supermarket</span></h1>
        <div class="language-switch" aria-label="Language selector">
            <button type="button" id="langIt" class="lang-btn" onclick="setLanguage('it')">ITA</button>
            <button type="button" id="langEn" class="lang-btn" onclick="setLanguage('en')">ENG</button>
        </div>
    </header>

    <nav class="page-nav">
        <a href="index.html" class="nav-link" data-i18n="nav.allViews">📊 All views</a>
        <span class="nav-link nav-link-active" aria-current="page" data-i18n="nav.inventory">📦 Inventory</span>
        <a href="checkout.html" class="nav-link" data-i18n="nav.checkout">🧾 Checkout</a>
    </nav>

    <main class="layout layout-single">
        <section class="panel" id="inventoryPanel">
            <h2><img class="emoji-img" src="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/1F4E6.svg" alt="package" width="22" height="22"> <span data-i18n="inventory.title">Inventory</span></h2>

            <div id="dbStatus" class="db-status db-disconnected">
                <span id="dbStatusText" data-i18n="db.disconnected">PostgreSQL database disconnected</span>
                <div class="db-buttons">
                    <button class="db-btn" id="btnReloadDb" onclick="loadInventory()"><img class="emoji-img" src="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/1F504.svg" alt="reload" width="16" height="16"> <span data-i18n="actions.reload">Reload</span></button>
                </div>
            </div>

            <section class="inventory-create">
                <h3 class="inventory-section-title" data-i18n="inventory.newItem">New item</h3>
                <div class="form-grid">
                    <input type="text" id="code" data-i18n-placeholder="placeholders.productCode" placeholder="Product code (e.g. A7K9M2B5)">
                    <input type="text" id="description" data-i18n-placeholder="placeholders.description" placeholder="Description (e.g. Banana)">
                    <input type="number" step="0.01" id="price" data-i18n-placeholder="placeholders.price" placeholder="Price €">
                    <div class="emoji-field">
                        <input type="text" id="emoji" data-i18n-placeholder="placeholders.iconCode" placeholder="Icon code (e.g. 1F34C)" maxlength="32" autocomplete="off">
                        <button type="button" id="emojiToggle" class="emoji-toggle" data-i18n-aria-label="actions.chooseEmoji" aria-label="Choose emoji"><img class="emoji-img" src="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/1F600.svg" alt="emoji picker" width="20" height="20"></button>
                        <div id="emojiPicker" class="emoji-picker" data-i18n-aria-label="inventory.emojiSelector" aria-label="Emoji selector"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <button id="btnAddItem" onclick="addOrUpdateItem()"><img class="emoji-img" src="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/2795.svg" alt="add" width="16" height="16"> <span data-i18n="actions.add">Add</span></button>
                    <input type="file" id="csvImportFile" accept=".csv,text/csv" hidden>
                    <button type="button" id="btnImportCsv" onclick="openCsvImportPicker()"><img class="emoji-img" src="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/1F4E5.svg" alt="import" width="16" height="16"> <span data-i18n="actions.importCsv">Import CSV</span></button>
                </div>
                <p class="import-hint" data-i18n="inventory.csvHint">CSV format: code,price,description,emoji (emoji optional)</p>
            </section>

            <section class="inventory-catalog">
                <h3 class="inventory-section-title" data-i18n="inventory.itemsInInventory">Items in inventory</h3>
                <div id="itemList" class="inventory-list"></div>
            </section>
        </section>
    </main>

    <div id="popupContainer" class="popup-container" aria-live="polite" aria-atomic="true"></div>

    <div id="confirmModal" class="confirm-modal" aria-hidden="true">
        <div class="confirm-modal-backdrop" data-modal-close="true"></div>
        <dialog class="confirm-modal-card" aria-labelledby="confirmModalTitle" aria-describedby="confirmModalMessage">
            <h3 id="confirmModalTitle" class="confirm-modal-title" data-i18n="modal.confirmTitle">Confirm action</h3>
            <p id="confirmModalMessage" class="confirm-modal-message" data-i18n="modal.confirmMessage">Are you sure you want to continue?</p>
            <div class="confirm-modal-actions">
                <button type="button" id="confirmModalCancel" class="confirm-btn confirm-btn-cancel" data-i18n="actions.cancel">Cancel</button>
                <button type="button" id="confirmModalConfirm" class="confirm-btn confirm-btn-danger" data-i18n="actions.confirm">Confirm</button>
            </div>
        </dialog>
    </div>

    <script src="vendor/qrcode.min.js"></script>
    <script src="negozio-app.js"></script>
</body>
</html>
